server:
  port: 8080

spring:
  application:
    name: springboot-demo
  
  servlet:
    multipart:
      max-file-size: 1024MB
      max-request-size: 10GB
  
  profiles:
    active: dev

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    serialization:
      write-dates-as-timestamps: false

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

  h2:
    console:
      enabled: true
      path: /h2-console

  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: 

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,env,beans
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: info
    com.example.demo: debug
    org.hibernate.SQL: debug

python:
  train:
    python-executable: python
    timeout-minutes: 120
    default-model-path: fno2_model.pth
    redirect-error-stream: true
    working-directory: c:/traework/a/wilmer-deeplearn/deeponet-cfd

fno:
  train:
    default-framework: pytorch
    data-root: c:/traework/a/wilmer-deeplearn/data
    default-epochs: 100
    default-batch-size: 8
    default-learning-rate: 0.001
    default-modes1: 12
    default-modes2: 12
    default-width: 32
    default-n-layers: 4
    default-hidden-dim: 128
    default-seed: 42

ftp:
  buffer-size: 8192
  connect-timeout: 30000
  data-timeout: 300000
  default-so-timeout: 60000
  passive-mode: true
  default-encoding: UTF-8
  auto-detect-encoding: true
  
  pool:
    max-total: 20
    max-idle: 10
    min-idle: 2
    max-wait-millis: 30000
    test-on-borrow: true
    test-on-return: true
    test-while-idle: true
    time-between-eviction-runs-millis: 60000
    min-evictable-idle-time-millis: 180000
    num-tests-per-eviction-run: 3
  
  retry:
    max-attempts: 3
    delay-millis: 1000
    multiplier: 2.0
  
  servers:
    default:
      host: localhost
      port: 21
      username: anonymous
      password: anonymous@example.com
      root-path: /
      connect-timeout: 30000
      data-timeout: 300000
      default-so-timeout: 60000
      passive-mode: true
      encoding: UTF-8
